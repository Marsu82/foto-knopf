plugins { id 'com.android.application' }
android {
    namespace 'de.fotoknopf'
    compileSdk 35
    defaultConfig {
        applicationId 'de.fotoknopf'
        minSdk 28
        targetSdk 35
        versionCode 6
        versionName '1.5'
    }
    // Signatur-Schlüssel liegt NICHT im Projekt. Pfad und Passwörter stehen in
    // keystore.properties (wird nicht hochgeladen). Ohne diese Datei: Debug-Schlüssel.
    def ksFile = rootProject.file('keystore.properties')
    def ks = new Properties()
    if (ksFile.exists()) ks.load(new FileInputStream(ksFile))
    signingConfigs {
        fotoknopf {
            if (ksFile.exists()) {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile.exists() ? signingConfigs.fotoknopf : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
